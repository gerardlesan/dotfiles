# Linked to ~/.config/xdg-desktop-portal/niri-portals.conf by install.sh; it
# replaces /usr/share/xdg-desktop-portal/niri-portals.conf (copied below)
# entirely, so keep that file's lines in sync.
# FileChooser=kde: Open/Save dialogs are Dolphin's (places, previews) instead
# of GTK's. The "Popups and dialogs float" window rule in niri/config.kdl
# already floats them (app-id xdg-desktop-portal-kde, "Open File" titles).
# Takes effect after: systemctl --user restart xdg-desktop-portal
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=kde;
