# Noctalia: deliberately BLOATED demo config, based on upstream example.toml.
# Lines tagged "# DEMO" differ from the defaults; delete the tag line to go back.
# Changes made in the Settings GUI go to ~/.local/state/noctalia/settings.toml and WIN over this file.
# Shared-with-KDE warning: [theme.templates] builtin_ids can write GTK/Qt/KDE color files that
# Plasma also reads. Leave them empty to keep both desktops independent.
#
# Design foundations are shared with ~/.config/niri/config.kdl (see its header):
#   gap 12 · radius 8/12/16 · one shadow direction (down) · Noto Sans
#   colors: Material 3 roles from the wallpaper, also pushed to niri via [theme.templates.user.niri]
# Most changes are hot-reloaded via inotify; startup-only settings are noted inline.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale              = 1.0
high_contrast         = false

[shell]
corner_radius_scale   = 1.0          # 0 = square, 1 = default, 2 = extra rounded
font_family           = "Noto Sans" # DEMO: same UI font as your GTK/Plasma apps
time_format           = "{:%H:%M}"  # default shell UI time format
date_format           = "%A, %x"    # default shell UI date format
offline_mode          = false        # block all outgoing HTTP when true
# panel_anchor_bar   = "main"        # bar panels attach to without a source bar; omit = first enabled bar
telemetry_enabled     = false        # send an anonymous startup ping
niri_overview_type_to_launch_enabled = true # DEMO: type in Mod+O overview to launch # opt in to type-to-launch from niri overview
polkit_agent          = true # DEMO: password prompts for apps (Plasma's agent does not run in niri)
password_style        = "default"    # default | random
readline_shortcuts    = false        # readline-style shortcuts in every text field (Ctrl+A = line start)
settings_show_advanced = true        # show advanced settings by default in Settings
settings_expand_all_groups = false   # expand every group on Settings pages by default
# settings_window_translucent = false  # translucent settings window background
show_location         = true         # hide weather location text in shell UI when false
app_icon_colorize     = false        # keep application icons in their own colours (true recolors them to app_icon_color)
# app_icon_color      = "on_surface" # ColorSpec role or #hex when colorize is enabled
clipboard_enabled     = true         # false disables clipboard panel, history, and compositor clipboard hooks
clipboard_history_max_entries = 100 # unpinned history cap (10–10000); pinned entries are extra
# A Wayland selection is served by the app that owns it, so it dies when that app exits.
# With this on, the shell claims it back so the item stays pasteable. Caveat: a password
# manager that clears the clipboard by exiting looks identical to any other app closing,
# so its secret can be kept alive too. Apps advertising x-kde-passwordManagerHint are
# already excluded; set this to false if you rely on one that does not.
clipboard_keep_from_closed_apps = true # keep the last copied item pasteable after the app you copied it from closes
clipboard_auto_paste  = "auto"       # off | auto | ctrl_v | ctrl_shift_v | shift_insert
clipboard_image_action_command = ""  # image preview action: gimp {path}, or satty -f - via stdin
# IPC example:
# noctalia msg clipboard-clear
shared_gl_context     = true         # startup-only; false isolates GPU contexts for broken drivers
# lang                = "en"
# avatar_path         = "~/Pictures/avatar.png"

# No sleep on this machine: suspend actions are hidden, and any built-in suspend
# (launcher, IPC, idle) is a no-op. Sleep targets are also masked system-wide.
[shell.session.power]
suspend = "true"

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"

[shell.screenshot]
skip_annotate_on_copy_save = false  # Ctrl+C / Ctrl+S in the region overlay skip the annotation editor
close_on_copy = true                # close the annotation editor after Copy or Ctrl+C succeeds
close_on_save = true                # close the annotation editor after Save or Ctrl+S succeeds

[shell.privacy]
mic_filter_regex = ""                # microphone app names to ignore in privacy indicators and OSD
cam_filter_regex = ""                # camera app names to ignore in privacy indicators and OSD
screen_filter_regex = ""             # screen-sharing app names to ignore in privacy indicators and OSD

[shell.animation]
enabled = true
speed   = 1.0                       # 0.5 = 2× slower, 2.0 = 2× faster

[shell.shadow]
direction = "down"                  # center, up, down, left, right, up_left, up_right, down_left, down_right
alpha     = 0.55                    # multiplied by each component's background opacity

[shell.panel]
transparency_mode     = "soft" # DEMO: translucent but readable; "glass" looks great and costs text contrast
# was: "solid"    # solid | soft | glass; controls floating-panel opacity and card translucency
borders               = true        # panel shell outline and in-panel section cards
border_color          = "outline"   # floating panel outline color: theme role token or #RRGGBB
border_width          = 1.0         # floating panel outline width in px, 0 hides the stroke
shadow                = true        # cast the global [shell.shadow] from panel surfaces
launcher_placement       = "floating" # attached | floating
clipboard_placement      = "floating" # attached | floating
control_center_placement = "attached" # attached | floating
wallpaper_placement      = "attached" # attached | floating
session_placement        = "attached" # attached | floating
launcher_position        = "center"   # auto | center | top_left | … (floating only)
clipboard_position       = "center"   # auto | center | top_left | … (floating only)
open_near_click_control_center = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_launcher       = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_clipboard      = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_wallpaper      = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_session        = false # for attached/floating placement, follow the bar click instead of bar-center

[shell.launcher]
layout = "full"                          # full | simple; simple is search, optional category chips, and results at 560x500
width = 760                              # full layout: panel width in pixels (560–1200)
search_position = "top"                  # full layout: top | bottom; whole launcher toolbar position
default_view   = "recent"                # full layout: recent | pinned | all | categories
categories = true                        # simple layout: show the category chip row under the search field
category_icons_only = false             # hide app category labels; keep names in hover tooltips
show_settings_button = true              # show the Settings shortcut beside search
show_session_button = true               # show the session-actions shortcut beside search
show_icons    = true                    # show application icons in launcher results
show_app_origin_indicator = true        # show package origin indicators on application results
compact       = false                   # use smaller icons and tighter result rows
app_grid      = false                   # show apps, global searches, and the provider overview as icon grids
track_usage   = true                    # record launcher history for Recent and usage-based sorting
sort_by_usage = true                    # boost frequently used results
pinned        = []                      # ordered apps in the Pinned view, e.g. ["firefox", "code", "kitty"]
fetch_exchange_rates = true             # refresh currency rates from third-party sources
provider_prefix = "/"                     # common prefix character for provider trigger words (e.g. "/" or ".")
auto_paste = "auto"                       # off | auto | ctrl_v | ctrl_shift_v | shift_insert (copy activations)

# For each provider: prefix = trigger word (empty falls back to its built-in default; triggers on
# provider_prefix + trigger, e.g. "/emo"). global = true also surfaces it in unprefixed search.
[shell.launcher.providers.calculator]
prefix = "calc"
global = true                           # also show calculator results in unprefixed search

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false                          # set true to include session actions in unprefixed search

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = []                      # ignore MPRIS players by bus/identity/desktop entry token

[shell.window_switcher]
style = "carousel"                    # "carousel" (depth layout) or "compact" (boxed strip)
mru = true # DEMO
# was: false                        # order windows by most recently used (Alt+Tab) instead of workspace layout
show_caption = true                 # show window titles and application names below previews
show_count = true                   # show the current and total window count above the previews
show_app_icon = true                # show application icons over window previews

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"        # center | crop | fit | stretch | repeat | span
fill_color          = ""            # optional fallback/fill color: prefer a color role token; fixed hex also works
transition          = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500          # milliseconds
edge_smoothness     = 0.3
transition_on_startup = false       # animate the first wallpaper at shell startup (v4-style)
directory           = "~/Pictures/Wallpapers" # PHM wallpapers only; also where the Wallhaven plugin downloads to
directory_light     = ""            # optional day-mode directory
directory_dark      = ""            # optional night-mode directory

[wallpaper.default]
path = "/home/roku/Pictures/Wallpapers/phm_adrian_void.png" # same as the Plasma lock screen

[wallpaper.automation]
enabled                    = false # was a DEMO rotation; off to keep your KDE wallpaper
interval_seconds           = 1800    # seconds between changes
order                      = "random" # random | alphabetical
recursive                  = true    # include subdirectories when picking random wallpapers

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"                     # dark | light | auto
source = "custom"                   # DEMO: KDE green, from ~/.config/noctalia/palettes/KdeGreen.json (builtin | wallpaper | community | custom)
custom_palette = "KdeGreen"         # your Plasma accent #00aa7f + your Plasma color scheme surfaces
builtin = "Noctalia"                # Ayu | Catppuccin | Dracula | Eldritch | Gruvbox |
                                    # Kanagawa | Noctalia | Nord | Rosé Pine | Tokyo-Night
# community_palette = "Noctalia"    # fetched from api.noctalia.dev, cached locally
wallpaper_scheme  = "m3-tonal-spot"  # DEMO: Material 3 default, calm and contrast-safe on any wallpaper  # m3-tonal-spot | m3-content | m3-fruit-salad |
                                    # m3-rainbow | m3-monochrome | vibrant | faithful |
                                    # dysfunctional | muted
pure_black_dark = false             # anchor dark surfaces to true black (OLED); applies to
                                    # every palette source, not just wallpaper-generated ones

[theme.templates]
enable_builtin_templates            = true
builtin_ids                = []     # opt-in; list ids with: noctalia theme --list-templates
enable_community_templates = true
community_ids              = []     # fetched from api.noctalia.dev/templates, cached locally

# User-defined templates are declared directly in config.
# DEMO: niri focus ring / borders / switcher follow the same palette as the shell.
[theme.templates.user.niri]
input_path  = "templates/niri-colors.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia-colors.kdl"

# [theme.templates.user.my_app]
# input_path  = "templates/my-app.css"
# output_path = "~/.config/my-app/theme.css"
# post_hook   = "my-app --reload-theme"

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = true # DEMO: blurred wallpaper behind the niri overview (pairs with a layer-rule in niri config)
blur_intensity         = 0.5        # 0.0 = no blur, 1.0 = maximum
tint_intensity         = 0.3        # 0.0 = no tint, 1.0 = opaque

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true           # show action buttons; when false, clicking a toast triggers its default action
keep_dismissed_in_history = true    # set false to remove history entries when their toasts are dismissed
layer              = "top"          # top | overlay
scale              = 1.0            # notification size multiplier applied on top of accessibility.ui_scale
background_opacity = 0.97
border             = true           # outline around toast cards; set false for a borderless look
border_color       = "outline"      # outline color: theme color role (e.g. "primary") or hex (e.g. "#a8b185")
border_width       = 1              # outline stroke width in px; raise for a thicker outline
follow_focused_output = false       # show new toasts on the focused output; visible toasts stay pinned there
# monitors          = ["DP-1"]      # connector names; omit or leave empty for all monitors
offset_x           = 12             # DEMO: 12 = the shared gap
offset_y           = 12             # absolute vertical margin from the screen edge
# [notification.filter.rhythmbox]
# enabled         = true
# match           = "rhythmbox"
# show_toast      = true
# save_history    = false
# play_sound      = true
# bypass_dnd      = false            # bypass DND for matching notifications; play_sound still controls sound
# allowed_urgencies = ["normal", "critical"]  # omit or list all three to allow every level
# IPC examples:
# noctalia msg notification-invoke-latest
# noctalia msg notification-clear-active
# noctalia msg notification-clear-history

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "bottom_center"
position_vertical = "top_center"    # same options; used when orientation = "vertical"
orientation = "horizontal"          # horizontal | vertical (volume/brightness sliders only; text popups stay horizontal)
hide_delay_ms = 1400                # time before a popup starts hiding; range 250 to 10000 ms
scale = 1.0                         # OSD size multiplier applied on top of accessibility.ui_scale
background_opacity = 0.5            # half see-through (no blur: niri blur on the OSD layer had no visible effect)
border = false                      # outline around OSD popup cards; set false for a borderless look
border_color = "outline"            # outline color: theme color role (e.g. "primary") or hex (e.g. "#a8b185")
border_width = 1                    # outline stroke width in px; raise for a thicker outline
follow_focused_output = true        # OSD only on the focused output (was false: every monitor showed the same popup, so a per-monitor Shift+brightness change looked like it hit both)
offset_x = 12                       # DEMO: 12 = the shared gap
offset_y = 96                       # absolute vertical margin from the screen edge; clears the dock (48px icons + padding + 12 gap)
# monitors = ["DP-1"]               # connector names; omit or leave empty for all monitors

[osd.kinds]
volume = true                       # master volume OSD toggle
volume_output = true                # output (speaker) volume; requires volume = true
volume_input = true                 # input (microphone) volume; requires volume = true
media = false                       # "Now Playing" popup on every track change: off
brightness = true                   # display brightness changes
wifi = true                         # Wi-Fi toggle
bluetooth = true                    # Bluetooth toggle
power_profile = true                # power profile changes
caffeine = true                     # idle inhibitor (caffeine) toggle
nightlight = true                   # night light toggle
dnd = true                          # Do Not Disturb toggle
lock_keys = true                    # Caps/Num/Scroll Lock changes; disable to stop polling when no widget uses them
keyboard_layout = true              # input keyboard layout changes
privacy = true                      # microphone/camera/screen-share capture changes

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled                 = true
grace_period_seconds    = 0           # passwordless unlock on any keypress or mouse movement for this long after locking (opt-in; default 0 = off)
blurred_desktop         = true # DEMO: lock screen shows your blurred desktop       # use a desktop snapshot as the lock screen background (requires wlr-screencopy)
transition              = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"] # empty disables lock/unlock animation
transition_duration     = 1500        # lock/unlock animation length in milliseconds
edge_smoothness         = 0.3         # transition edge feathering (0.0 = sharp, 1.0 = soft)
blur_intensity          = 0.5         # lock screen background blur (0.0 = none, 1.0 = maximum)
tint_intensity          = 0.3         # surface-color tint over the lock screen background
# wallpaper             = ""          # optional image path for the lock screen; empty uses the desktop wallpaper
# monitors              = ["DP-1"]    # connectors that show the lock screen; empty shows all monitors, others stay black

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true                      # sample CPU, memory, network, load, temperature, GPU VRAM, and disk statistics
cpu_poll_seconds = 2.0              # CPU usage, CPU temperature, and load average
cpu_freq_activity_threshold = 2.5   # GHz; value tint starts when CPU clock crosses this
cpu_freq_critical_threshold = 4.5   # GHz; full highlight at/above this
gpu_poll_seconds = 5.0              # GPU temperature and VRAM usage
memory_poll_seconds = 2.0           # RAM usage
network_poll_seconds = 3.0          # network throughput
disk_poll_seconds = 10.0            # disk usage and swap usage; graph widgets use the fastest poll above

# ── Calendar ──────────────────────────────────────────────────────────────────

[calendar]
enabled                     = false
dedupe_events               = false         # merge an event that appears in more than one calendar into one entry
dedupe_ignore_patterns      = []            # regexes stripped from a title before events are compared, e.g. ['\s*\(.*\)$']
refresh_minutes             = 15
event_date_format           = "%A %e %B"    # date format used for events
event_time_format           = "%H:%M"       # time format used for events

# Notifications for upcoming events.

[calendar.reminders]
enabled              = true
use_event_reminders  = true     # honor per-event reminders; off = always use the default lead below
default_lead_minutes = 10       # used for events with no reminder of their own; 0 = at event start
all_day_digest_time  = "09:00"  # one notification listing today's all-day events; "" disables it

# Calendar tab of the control center.

[control_center.calendar]
show_events_card            = true
show_week_numbers           = false         # ISO 8601 week numbers in the month grid

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = true # DEMO
refresh_minutes = 30
unit            = "celsius"         # celsius | fahrenheit
effects         = true              # visual weather effects
# Weather uses the coordinates resolved by [location] (see below).

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false            # allow volume above 100% (up to 150%)
enable_sounds = false               # master toggle for shell sounds (plugins unaffected)
enable_volume_sounds = true         # sound on volume changes
enable_notification_sounds = true   # sound on notifications
enable_power_sounds = true          # sound on charger connect or remove
enable_screenshot_sounds = true     # sound on screenshots
sound_volume = 0.5                  # 0.0 - 1.0
sound_theme = "freedesktop"

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = true
sync_all_monitors = false          # sliders stay per-monitor; the niri brightness keys pass "all" to keep both in step (Shift+key = focused only)
# ignore_mmids = []                 # skip these monitors from ddcutil; run: ddcutil --verbose detect
# minimum_brightness = 0.0          # never let brightness drop below this floor (0.0 to 1.0)

# Per-monitor backend override:
# [brightness.monitor.eDP-1]
# backend = "backlight"             # auto | none | backlight | ddcutil
# backlight_device = "intel_backlight"  # explicit sysfs device name or path; run: noctalia msg brightness-list-backlight-devices
# [brightness.monitor.DP-1]
# backend = "ddcutil"
# [brightness.monitor.DP-2]
# ddc_bus = 6                       # pin the I2C bus when monitors share an EDID

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled              = true # DEMO: warmer screen after sunset
force                = false
temperature_day      = 6500         # Kelvin
temperature_night    = 4000         # Kelvin

# ── Location ──────────────────────────────────────────────────────────────────
# Single source of "where am I"; feeds Weather, Night Light, and Theme auto mode.

[location]
auto_locate      = true              # DEMO: IP-based location for weather/night light. Privacy: set false + address = "City"
address          = ""                # e.g. "Toronto, ON"; geocoded when auto_locate = false
# latitude       = 52.5200           # manual coordinates, used when auto_locate and address are off
# longitude      = 13.4050
# custom_schedule = true    # schedule day/night from the times below instead of coordinates
# sunset         = "20:30"           # HH:MM, night start
# sunrise        = "07:30"           # HH:MM, day start

# ── Idle ──────────────────────────────────────────────────────────────────────

# Optional `[idle]` keys:
#   pre_action_fade_seconds: fade a fullscreen surface-color overlay in over this many seconds, then run `command`.
#                             Use 0 for immediate commands with no overlay. Input during the fade cancels.
# [idle]
# pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true # DEMO

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true # DEMO

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
delete   = ["del"]

# ── Bar ───────────────────────────────────────────────────────────────────────

# DEMO: mirrors your Plasma panel: floating top bar, launcher + window title left,
# clock centred, tray + control center right (like Andromeda / Control Station).
[bar.main]
position           = "top"          # top | bottom | left | right
thickness          = 34
background_opacity = 0.92 # DEMO: Breeze-like translucency with blur behind
compositor_blur    = true          # false stops compositor blur for this bar
radius             = 12
margin_ends        = 4 # body lands at x=8, flush with niri gaps 8: noctalia insets the body ~2x this (measured: 4 -> 8px, 3 -> 6px)
border             = "outline" # DEMO: thin Breeze-style outline
border_width       = 1.0
margin_edge        = 0 # attached to the top edge; niri gaps 8 is the bar-to-window space
padding            = 14
widget_spacing     = 6
scale              = 1.0
font_scale         = 1.0            # text-only scale multiplier across widgets
shadow             = true
auto_hide          = false
# auto_hide_delay_ms = 0           # delay hiding after pointer leaves, 0 to 600000 ms (On mode only)
# smart_auto_hide    = false       # show when the active workspace is empty; hide when it has windows
# show_on_workspace_switch = true   # with auto_hide: briefly reveal when the active workspace changes
reserve_space      = true
capsule            = false # DEMO: flat widgets like a Plasma panel (true = pills)
# capsule_fill     = "surface_variant"
# capsule_radius   = 8.0            # omit/blank in Settings for automatic pill radius; 0.0 = square
# capsule_opacity  = 1.0
# capsule_border   = "outline"      # uncomment for a border on all widgets
# capsule_border_width = 1.0        # outline thickness in pixels (0-8); needs capsule_border

start  = ["launcher", "workspaces", "active_window"]   # DEMO
center = ["clock"]
end    = ["media", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center"] # DEMO

# Commands for the bar margin outside widget sections (dead zone):
# [bar.main.dead_zone.actions]
# left = "panel-toggle launcher"
# right = "panel-toggle control-center"
# middle = "none"
# scroll_up = "none"
# scroll_down = "none"

# Per-monitor override example; only the fields you list are overridden:
# [bar.main.monitor.dp1]
# match           = "DP-1"
# thickness       = 44
# compositor_blur = false
# [bar.main.monitor.dp1.dead_zone.actions]
# left = "panel-toggle launcher"

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled             = true # DEMO
position            = "bottom"      # top | bottom | left | right
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 12 # DEMO: shared gap (was 8)
shadow              = true
show_running        = true
auto_hide           = false
smart_auto_hide     = true # DEMO: dock only shows on empty workspaces
reserve_space       = false # DEMO
layer               = "top"         # top | overlay
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = true # DEMO
show_instance_count = true
launcher_position   = "start" # DEMO: app-grid button in the dock (none | start | end)
launcher_icon       = "grid-dots"  # Tabler glyph name
active_monitor_only = false
pinned              = ["zen", "com.mitchellh.ghostty", "org.kde.dolphin"] # DEMO

# Per-monitor override example; first match wins and omitted fields inherit [dock]:
# [dock.monitor.laptop]
# match               = "eDP-1"
# enabled             = true
# icon_size           = 40
# magnification_scale = 1.3
# pinned              = ["firefox", "org.gnome.Nautilus"]
#
# [dock.monitor.external]
# match    = "DELL"                 # a word-boundary token in the output description
# position = "left"
# enabled  = false

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false # the clock now lives in the bar; set true for the big desktop clock (move it: noctalia msg desktop-widgets-edit)
widget_order = ["clock_main"]

# [desktop_widgets.grid]
# visible        = true
# cell_size      = 16
# major_interval        = 4
# center_guides_visible = false
# snap_to_center        = true

[desktop_widgets.widget.clock_main] # DEMO
type     = "clock"
output   = "eDP-1"
cx       = 960.0
cy       = 300.0
scale    = 2.0
rotation = 0.0

[desktop_widgets.widget.clock_main.settings] # DEMO
format = "{:%H:%M}"
background_opacity = 0.0

# [lockscreen_widgets]
# enabled = false
# widget_order = ["clock_main"]

# [lockscreen_widgets.widget.clock_main]
# type     = "clock"
# output   = "DP-1"
# cx       = 1600.0
# cy       = 120.0
# scale    = 1.5
# rotation = 0.0

# [lockscreen_widgets.widget.clock_main.settings]
# format = "{:%H:%M}"
# background_opacity = 0.8

# ── Control Center ────────────────────────────────────────────────────────────

# Shortcut buttons shown on the right side of the dashboard (up to 6).
# DEMO: shortcut buttons enabled
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "wallpaper"
[[control_center.shortcuts]]
type = "screen_recorder"
[[control_center.shortcuts]]
type = "session"

